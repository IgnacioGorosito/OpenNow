<header class="topbar">
  <a routerLink="/" class="brand" aria-label="OpenNow, inicio">
    <img src="logo-mark.svg" alt="" width="34" height="34" />
    <span class="wordmark">Open<span class="now">Now</span></span>
  </a>

  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Buscar</a>

    @if (auth.user(); as u) {
      @if (u.role === 'owner') {
        <a routerLink="/owner" routerLinkActive="active">Mi negocio</a>
      }
      @if (u.role === 'admin') {
        <a routerLink="/admin" routerLinkActive="active">Administración</a>
      }
      <span class="user">
        <span class="avatar">{{ u.name.charAt(0).toUpperCase() }}</span>
        <span class="who">{{ u.name }}<small>{{ roleLabel(u.role) }}</small></span>
      </span>
      <button type="button" class="logout" (click)="logout()">Salir</button>
    } @else {
      <a routerLink="/login">Ingresar</a>
      <a routerLink="/login" [queryParams]="{ modo: 'registro' }" class="cta">Crear cuenta</a>
    }
  </nav>
  <button type="button" class="theme-btn" (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Cambiar a tema original' : 'Cambiar a tema oscuro'"
        [attr.title]="theme.theme() === 'dark' ? 'Tema original' : 'Tema oscuro'">
  @if (theme.theme() === 'dark') {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
  }
</button>
</header>

<main class="content">
  <router-outlet />
</main>
