services:
  postgres:
    image: postgres:17
    container_name: postgres_opennow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=opennow

volumes:
  postgres_data:
    driver: local
